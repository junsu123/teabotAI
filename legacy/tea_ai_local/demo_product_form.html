<!doctype html><html lang="vi"><meta charset="utf-8"><title>Mẫu form nội bộ – không phải Shopee/TikTok</title>
<style>body{font:16px system-ui;max-width:660px;margin:40px auto}label{display:block;margin:18px 0}input,textarea{display:block;width:100%;padding:10px}button{padding:10px 20px}</style>
<h1>Form mẫu kiểm thử bộ nhận diện DOM</h1>
<label>Tên sản phẩm<input name="product_name" aria-label="Tên sản phẩm" placeholder="Nhập tên sản phẩm"></label>
<label>Mô tả<textarea name="description" placeholder="Nhập mô tả"></textarea></label>
<label>Giá bán<input name="price" type="number"></label>
<label>Tồn kho<input name="stock" type="number"></label>
<label>Tải ảnh sản phẩm<input name="images" type="file" accept="image/*" multiple></label>
<p>Chỉ dùng để thực hành trên máy tính, không liên kết các sàn.</p>
