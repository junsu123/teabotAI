name: Python smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GUI dependencies
        run: python -m pip install -r studio/requirements_gui.txt
      - name: Compile Python code
        run: python -m compileall -q studio legacy/tea_ai_local
      - name: Run offline unit tests
        run: python -m unittest discover -s studio/tests -v
